<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#251d3f">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="vendor/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="vendor/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<title>GTA 6 Checkliste</title>
</head>
<body>
<div id="scene" class="scene" aria-hidden="true"></div>
<header class="appbar">
  <img class="logo" src="icons/logo.svg" alt="" width="40" height="27">
  <div class="appname"><b>Story-Checkliste</b><span id="appsub">Leonida</span></div>
</header>
<main id="view" aria-live="polite"></main>
<nav id="tabs" class="tabbar" aria-label="Hauptnavigation">
  <button data-tab="now" data-icon="compass">Jetzt</button>
  <button data-tab="story" data-icon="book-open">Story</button>
  <button data-tab="side" data-icon="map">Neben</button>
  <button data-tab="spots" data-icon="map-pin">Fundorte</button>
  <button data-tab="more" data-icon="ellipsis">Mehr</button>
</nav>
<dialog id="dlg" class="sheet"></dialog>
<div id="snack" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
