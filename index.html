<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#473875">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>GTA 6 Checkliste</title>
</head>
<body>
<div class="scene sky" aria-hidden="true">
  <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMin slice">
    <g class="streak" fill="#d091ca" opacity=".28">
      <ellipse cx="120" cy="58" rx="90" ry="3"/><ellipse cx="300" cy="40" rx="70" ry="2.5"/><ellipse cx="230" cy="78" rx="60" ry="2"/>
    </g>
    <g class="jet">
      <defs>
        <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fcf0d8" stop-opacity=".55"/>
          <stop offset="1" stop-color="#fcf0d8" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <g transform="translate(262 96) rotate(-26)">
        <rect x="6" y="-1.1" width="260" height="2.2" rx="1.1" fill="url(#trail)"/>
        <rect x="6" y="-3.2" width="200" height="6.4" rx="3.2" fill="url(#trail)" opacity=".25"/>
        <g transform="rotate(180)" fill="#483c84">
          <path d="M9 0 C9-.9 7-1.2 4.5-1.2 L-6-1 L-8.5-.6 V.6 L-6 1 L4.5 1.2 C7 1.2 9 .9 9 0Z"/>
          <path d="M2.5-1 L-2.5-8.5 H-4.3 L-1.8-1Z M2.5 1 L-2.5 8.5 H-4.3 L-1.8 1Z"/>
          <path d="M-5.6-.8 L-7.6-3.8 H-8.6 L-7.4-.7Z M-5.6 .8 L-7.6 3.8 H-8.6 L-7.4 .7Z"/>
          <circle class="blink" cx="-3.6" cy="-8.2" r=".9" fill="#f89fc2"/>
        </g>
      </g>
    </g>
  </svg>
</div>
<main id="view" aria-live="polite"></main>
<nav id="tabs" aria-label="Hauptnavigation">
  <button data-tab="now">Aufgaben</button>
  <button data-tab="missions">Missionen</button>
  <button data-tab="items">Einträge</button>
  <button data-tab="settings">Mehr</button>
</nav>
<dialog id="dlg"></dialog>
<div id="snack" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
